# Render deployment configuration for Vertex Legacy
# Deploy: Push to GitHub → New → Blueprint at dashboard.render.com

services:
  - type: web
    name: vertex-legacy-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    region: oregon
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_PROVIDER
        value: mock
      - key: PAYMENT_PROVIDER
        value: paymongo
      - key: PAYOUT_PROVIDER
        value: xendit
      - key: KYC_PROVIDER
        value: licensed
      - key: API_PORT
        value: "4000"
      - key: WEB_ORIGIN
        value: https://vertex-legacy-staging.onrender.com
      - key: AUTH0_AUDIENCE
        value: https://api.vertex-legacy.com
    healthCheckPath: /v1/health

databases:
  - name: vertex-legacy-db
    databaseName: vertex_legacy
    user: vertex
    region: oregon
    plan: free

# Redis: Create manually in Render Dashboard (New → Redis) - free tier available
