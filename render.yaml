# Render deployment configuration for Vertex Legacy
# Deploy: Push to GitHub → New → Blueprint at dashboard.render.com

services:
  - type: web
    name: vertex-legacy-api
    runtime: node
    buildCommand: |
      pnpm install --frozen-lockfile
      pnpm --filter @vertex/database generate
      pnpm --filter @vertex/api build
    startCommand: |
      pnpm --filter @vertex/database migrate:deploy
      pnpm --filter @vertex/database seed
      pnpm --filter @vertex/api start
    region: oregon
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: development
      - key: AUTH_PROVIDER
        value: mock
      - key: PAYMENT_PROVIDER
        value: paymongo
      - key: PAYOUT_PROVIDER
        value: xendit
      - key: KYC_PROVIDER
        value: licensed
      - key: API_PORT
        value: "4000"
      - key: WEB_ORIGIN
        value: https://vertex-legacy-api.onrender.com
      - key: AUTH0_AUDIENCE
        value: https://api.vertex-legacy.com
      # DATABASE_URL auto-injected from database
      - key: DATABASE_URL
        fromDatabase:
          name: vertex-legacy-db
          property: connectionString
    healthCheckPath: /v1/health

databases:
  - name: vertex-legacy-db
    databaseName: vertex_legacy
    user: vertex
    region: oregon
    plan: free

# Redis: Create manually in Render Dashboard → New → Redis
# Name: vertex-legacy-redis, Region: oregon, Plan: free
# Then add REDIS_URL as secret in API service Environment tab